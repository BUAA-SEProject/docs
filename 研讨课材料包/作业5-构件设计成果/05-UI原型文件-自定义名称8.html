function drawStatistics(from,to,chosenType){
 const types=Object.keys(workTypes).filter(type=>!chosenType||type===chosenType);
 const rows=Array.from({length:to-from+1},(_,i)=>({year:from+i,counts:Object.fromEntries(types.map(type=>[type,0])),total:0}));
 allWorks.forEach(w=>{
  if(w.year!==null&&w.year>=from&&w.year<=to&&types.includes(w.type)){
   rows[w.year-from].counts[w.type]+=1;
   rows[w.year-from].total+=1;
  }
 });
 const total=rows.reduce((n,row)=>n+row.total,0);
 const max=Math.max(1,...rows.map(row=>row.total));
 const title='<p class="stats-caption small" role="status">'+from+'–'+to+' 年 · 共 '+total+' 项 · 快照 '+statsAsOf+'</p>';
 const legend='<div class="stats-legend" aria-hidden="true">'+types.map(type=>'<span><i class="'+type.toLowerCase()+'"></i>'+workTypes[type]+'</span>').join('')+'</div>';
 const chart=rows.length<=10&&total?'<div class="stats-charts" aria-hidden="true">'+rows.map(row=>'<div class="stats-chart"><span>'+row.year+'</span><div class="bar-track">'+types.map(type=>'<span class="'+type.toLowerCase()+'" style="width:'+row.counts[type]*100/max+'%"></span>').join('')+'</div><strong>'+row.total+'</strong></div>').join('')+'</div>'+legend:'';
 const cells=rows.map(row=>'<tr><th scope="row">'+row.year+'</th>'+types.map(type=>'<td>'+row.counts[type]+'</td>').join('')+'<td>'+row.total+'</td></tr>').join('');
 const table='<details class="stats-details"'+(chart?'':' open')+'><summary>年度统计数据表</summary><div class="table-scroll" role="region" aria-label="年度统计数据表" tabindex="0"><table class="table"><thead><tr><th scope="col">年份</th>'+types.map(type=>'<th scope="col">'+workTypes[type]+'</th>').join('')+'<th scope="col">合计</th></tr></thead><tbody>'+cells+'</tbody></table></div></details>';
 statsResult.innerHTML=title+(!total?'<p class="note" style="margin-top:8px">该区间没有可计入年度的公开成果。</p>':'')+chart+table;
}
statsForm.addEventListener('submit',event=>{
 event.preventDefault();
 const from=Number(statsForm.elements.yearFrom.value);
 const to=Number(statsForm.elements.yearTo.value);
 if(!yearRangeValid(from,to)){formError(statsForm,'起始年份应小于或等于结束年份。','yearTo');return;}
 if(to-from+1>100){formError(statsForm,'年度区间最多包含 100 个自然年。','yearTo');return;}
 clearFormError(statsForm);
 drawStatistics(from,to,statsForm.elements.type.value);
});

 const rows=taskRows.filter(row=>!state.taskFilter||row.status===state.taskFilter);
 const current=rows.find(row=>row.id===state.selectedTask)||rows[0];
 const select='<label class="result-tools small">状态 <select id="task-filter">'+option('','全部',state.taskFilter)+['QUEUED','RUNNING','SUCCEEDED','FAILED'].map(s=>option(s,statuses[s][0],state.taskFilter)).join('')+'</select></label>';
 const table='<div class="card pad"><div class="section-head"><h2>任务列表</h2>'+select+'</div>'+(rows.length?accessibleTable('采集任务列表','<table class="table"><thead><tr><th scope="col">编号 / 创建时间</th><th scope="col">来源</th><th scope="col">模式</th><th scope="col">状态</th><th scope="col">处理量</th><th scope="col">操作</th></tr></thead><tbody>'+rows.map(t=>'<tr'+(t===current?' class="selected"':'')+'><td>'+t.id+'<small class="muted">'+t.when+'</small></td><td>'+sourceName(t.source)+'</td><td>'+(t.mode==='INCREMENTAL'?'增量':'全量')+'</td><td>'+badge(t.status)+'</td><td>'+taskCounting(t)+'</td><td>'+button('查看进度','select-task','subtle','data-value="'+t.id+'" aria-label="查看任务 '+t.id+' 进度"')+'</td></tr>').join('')+'</tbody></table>'):'<p class="muted">没有符合条件的任务。</p>')+'</div>';
 const active=current&&['QUEUED','RUNNING'].includes(current.status);
 const taskDetail=current?'<section class="card pad stack"><div class="section-head"><div><h2 id="task-progress" class="panel-title" tabindex="-1">任务 '+current.id+' 进度</h2><p class="muted">'+sourceName(current.source)+' · 检查点 '+esc(current.checkpointAt??'待确认')+'</p></div>'+(active?button('刷新演示进度','refresh-task','secondary','data-value="'+current.id+'"'):'')+'</div><progress class="meter"'+(current.total===null?'':' max="'+current.total+'" value="'+current.done+'"')+' aria-label="采集任务处理进度"></progress><p class="progress-copy">'+taskCounting(current)+' · '+badge(current.status)+'</p>'+(current.error?'<p class="note error">'+esc(current.failureCode)+' · '+esc(current.error)+'</p>':'')+'</section>':'';
 const taskForm=state.taskForm?'<section class="card pad"><h2>创建采集任务</h2><p class="muted">提交后显示任务编号，可以在列表中查询状态。</p><form id="task-form" class="form"><label class="group">已启用数据源<select name="sourceId" required>'+sourceOptions.map(([value,label])=>option(value,label,'201')).join('')+'</select></label><label class="group">采集模式<select name="mode">'+option('INCREMENTAL','按检查点增量采集','INCREMENTAL')+option('FULL','首批全量采集','INCREMENTAL')+'</select></label><p class="note error form-error" role="alert" tabindex="-1" hidden></p><div class="actions"><button class="btn" type="submit">提交任务</button>'+button('取消','toggle-task-form')+'</div></form></section>':'';
 return adminPage('tasks','<div class="section-head"><div>'+heading('采集任务管理','查看已授权来源的异步采集、最近检查点与失败原因。')+'</div>'+button('创建采集任务','toggle-task-form','',state.taskForm?'aria-expanded="true"':'aria-expanded="false"')+'</div>'+statStrip(['QUEUED','RUNNING','SUCCEEDED','FAILED'].map(s=>[statuses[s][0],taskRows.filter(t=>t.status===s).length]))+taskForm+table+taskDetail);
}

function reviewView(){
 const rows=claimRows.filter(row=>!state.reviewFilter||row.status===state.reviewFilter);
 const current=rows.find(row=>row.id===state.selectedClaim)||rows[0];
 const select='<label class="result-tools small">状态 <select id="review-filter">'+option('','全部',state.reviewFilter)+['PENDING','APPROVED','REJECTED'].map(s=>option(s,statuses[s][0],state.reviewFilter)).join('')+'</select></label>';
 const table='<section class="card pad"><div class="section-head"><h2>认领申请列表</h2>'+select+'</div>'+(rows.length?accessibleTable('认领申请列表','<table class="table"><thead><tr><th scope="col">申请编号</th><th scope="col">申请学者</th><th scope="col">申请人账号</th><th scope="col">提交时间</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody>'+rows.map(c=>'<tr'+(c===current?' class="selected"':'')+'><td>'+c.id+'</td><td>'+c.scholar+'</td><td>'+esc(c.applicantAccountId)+'</td><td>'+c.when+'</td><td>'+badge(c.status)+'</td><td>'+button('查看申请','select-claim','subtle','data-value="'+c.id+'" aria-label="查看申请 '+c.id+'"')+'</td></tr>').join('')+'</tbody></table>'):'<p class="muted">没有符合条件的申请。</p>')+'</section>';
 const reviewForm=current?.status==='PENDING'?'<form class="form" id="review-form"><input type="hidden" name="claimId" value="'+current.id+'"><input type="hidden" name="version" value="'+current.version+'"><label class="group">审核决定<select name="decision" id="decision">'+option('APPROVE','通过并绑定门户',state.reviewDecision)+option('REJECT','驳回并告知申请人',state.reviewDecision)+'</select></label><label class="group">审核意见（最多 1000 字）<textarea id="review-reason" name="comment" maxlength="1000" '+(state.reviewDecision==='REJECT'?'required':'')+' placeholder="驳回时必填，请说明申请人可以补充的材料。"></textarea></label><p class="note error form-error" role="alert" tabindex="-1" hidden></p><div class="actions"><button class="btn" type="submit">确认审核决定</button></div></form>':'';
 const panel=current?'<section class="card pad stack"><div class="section-head"><h2 id="review-detail" class="panel-title" tabindex="-1">审核详情 · '+current.id+'</h2>'+badge(current.status)+'</div><div><p>申请学者 '+current.scholar+' · 证明材料 '+current.evidence.length+' 份</p><ul class="evidence-files">'+current.evidence.map((name,index)=>'<li>'+button(esc(name),'preview-evidence','subtle','data-value="'+current.id+'/'+index+'" aria-haspopup="dialog"')+'</li>').join('')+'</ul></div>'+(current.statement?'<p>申请说明 '+esc(current.statement)+'</p>':'')+(current.reason?'<p class="note">'+esc(current.reason)+'</p>':'')+reviewForm+'</section>':'';
 return adminPage('review',heading('认领审核','核验申请材料，记录决定并向申请人反馈。')+table+panel);
}
function render(){
 const {page,id}=currentPage();
 const navPage=page==='detail'?'search':['tasks','review'].includes(page)?'tasks':page;
 nav.innerHTML=[['search','成果检索'],['portal/3001','学者门户'],['claim/3001','认领申请'],['tasks','管理后台']].map(([route,label])=>'<a href="#'+route+'"'+(navPage===route.split('/')[0]?' aria-current="page"':'')+'>'+label+'</a>').join('');
 role.value=state.role;
 document.title=pages[page]+' · SHARE 学术成果分享平台';
 main.innerHTML={search:searchView,portal:portalView,detail:detailView,claim:claimView,tasks:tasksView,review:reviewView}[page](id);
}
function clearFormError(form){
 const region=form.querySelector('.form-error');
 if(!region)return;
 region.hidden=true;
 form.querySelectorAll('[aria-invalid]').forEach(field=>field.removeAttribute('aria-invalid'));
}
function formError(form,message,field){
 clearFormError(form);
 const region=form.querySelector('.form-error');
 region.textContent=message;
 region.hidden=false;
 if(field)form.elements[field].setAttribute('aria-invalid','true');
 region.focus();
}
function focusPanel(id){document.getElementById(id)?.focus();}
function previewEvidence(value){
 if(state.role!=='admin')return;
 const [claimId,index]=value.split('/');
 const claim=claimRows.find(row=>row.id===claimId);
 const fileName=claim?.evidence[Number(index)];
 if(!fileName)return;
 document.getElementById('evidence-result').innerHTML='<dl class="meta"><div><dt>申请编号</dt><dd>'+claimId+'</dd></div><div><dt>文件名</dt><dd>'+esc(fileName)+'</dd></div></dl><p class="note stats-caption">原型提供材料登记信息。实际审核通过受控接口读取文件内容。</p>';
 evidenceDialog.showModal();
}
function nowLabel(){return new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai',hour12:false}).slice(0,16);}
function changeRole(value){state.role=value;state.taskForm=false;render();}
main.addEventListener('submit',event=>{
 event.preventDefault();
 const form=event.target;
 const values=new FormData(form);
 let focusAfter;
 switch(form.id){
  case 'search-form':
   state.search={...state.search,q:String(values.get('q')).trim(),page:1};focusAfter='results-title';break;
  case 'filter-form': {
   const next=Object.fromEntries(values);
   if(!yearRangeValid(next.yearFrom,next.yearTo)){formError(form,'起始年份应小于或等于结束年份。','yearTo');return;}
   state.search={...state.search,...next,page:1};focusAfter='results-title';break;
  }
  case 'claim-form': {
   if(state.role!=='member')return;
   if(state.myClaim?.status==='PENDING'||state.myClaim?.status==='APPROVED'){formError(form,'该门户已有待处理或已通过的申请。');return;}
   const reason=String(values.get('reason')).trim();
   const files=values.getAll('evidence').filter(file=>file.name);
   if(!reason){formError(form,'请填写申请说明。','reason');return;}
   if(files.length<2||files.length>5){formError(form,'请选择 2 至 5 份证明文件。','evidence');return;}
   if(files.some(file=>!/\.(pdf|png|jpe?g)$/i.test(file.name)||file.size>10*1024*1024)){formError(form,'请提交不超过 10 MiB 的 PDF、PNG 或 JPG 文件。','evidence');return;}
   const item={id:String(7301+claimRows.length),scholar:'林予知',applicantAccountId:'4204',status:'PENDING',when:nowLabel(),version:1,evidence:files.map(file=>file.name),owner:true,statement:reason};
   claimRows.unshift(item);state.myClaim=item;state.selectedClaim=item.id;state.reviewFilter='';alertUser('认领申请已提交。');focusAfter='claim-progress';break;
  }
  case 'task-form': {
   if(state.role!=='admin')return;
   const source=String(values.get('sourceId'));
   const activeTask=taskRows.find(task=>task.source===source&&['QUEUED','RUNNING'].includes(task.status));
   if(activeTask){formError(form,'该来源已有活动任务 '+activeTask.id+'，可更换来源或查看现有任务。','sourceId');return;}
   const item={id:String(5201+taskRows.length),source,mode:String(values.get('mode')),status:'QUEUED',done:0,total:null,checkpointAt:null,when:nowLabel()};
   taskRows.unshift(item);state.selectedTask=item.id;state.taskFilter='';state.taskForm=false;alertUser('已受理采集任务 '+item.id+'。');focusAfter='task-progress';break;
  }
  case 'review-form': {
   if(state.role!=='admin')return;
   const item=claimRows.find(c=>c.id===String(values.get('claimId')));
   if(!item||item.status!=='PENDING'||item.version!==Number(values.get('version'))){formError(form,'申请状态已经变化，请重新打开该申请。');return;}
   const reason=String(values.get('comment')).trim();
   if(state.reviewDecision==='REJECT'&&!reason){formError(form,'请填写驳回理由。','comment');return;}
   if(state.reviewDecision==='APPROVE'&&claimRows.some(c=>c!==item&&c.scholar===item.scholar&&c.status==='APPROVED')){formError(form,'门户已经绑定，请核实后处理。');return;}
   item.status=state.reviewDecision==='APPROVE'?'APPROVED':'REJECTED';item.version+=1;item.reason=reason;state.reviewFilter='';alertUser('审核决定已保存。');focusAfter='review-detail';break;
  }
  default:return;
 }
 render();
 if(focusAfter)focusPanel(focusAfter);
});
main.addEventListener('change',event=>{
 const field=event.target;
 switch(field.id){
  case 'sort':state.search.sort=field.value;state.search.page=1;break;
  case 'task-filter':state.taskFilter=field.value;break;
  case 'review-filter':state.reviewFilter=field.value;break;
  case 'decision':
   state.reviewDecision=field.value;document.getElementById('review-reason').required=field.value==='REJECT';return;
  default:return;
 }
 render();
 document.getElementById(field.id)?.focus();
});
main.addEventListener('click',event=>{
 const control=event.target.closest('[data-action]');
 if(!control)return;
 event.preventDefault();
 const value=control.dataset.value;
 switch(control.dataset.action){
  case 'open-stats':openStatistics();return;
  case 'preview-evidence':previewEvidence(value);return;
  case 'keyword':state.search={...searchDefaults,q:value};goto('search');focusPanel('results-title');return;
  case 'reset-search':state.search={...searchDefaults,q:state.search.q};break;
  case 'clear-search':state.search={...searchDefaults};render();focusPanel('results-title');return;
  case 'remove-filter':
   if(value==='years'){state.search.yearFrom='';state.search.yearTo='';}
   else if(['q','type','fieldId','institutionId'].includes(value)){state.search[value]='';}
   state.search.page=1;render();focusPanel('results-title');return;
  case 'portal-filter':state.portalType=value;break;
  case 'search-page':state.search.page=Number(value);break;
  case 'set-role':changeRole(value);role.focus();return;
  case 'toggle-task-form':state.taskForm=!state.taskForm;break;
  case 'select-task':state.selectedTask=value;render();focusPanel('task-progress');return;
  case 'select-claim':state.selectedClaim=value;state.reviewDecision='APPROVE';render();focusPanel('review-detail');return;
  case 'refresh-task': {
   const task=taskRows.find(row=>row.id===value);
   if(!task)return;
   if(task.status==='QUEUED'){task.status='RUNNING';}
   else if(task.status==='RUNNING'){
    task.total=task.total??1000;
    task.done=Math.min(task.done+170,task.total);
    task.checkpointAt=nowLabel();
    if(task.done>=task.total)task.status='SUCCEEDED';
   }
   alertUser('任务状态已刷新。');break;
  }
  default:return;
 }
 render();
 if(control.dataset.action==='toggle-task-form'&&state.taskForm)document.querySelector('#task-form select')?.focus();
 else Array.from(main.querySelectorAll('[data-action]')).find(item=>item.dataset.action===control.dataset.action&&item.dataset.value===value&&!item.disabled)?.focus();
});
role.addEventListener('change',()=>changeRole(role.value));
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus();});
window.addEventListener('hashchange',()=>{if(statsDialog.open)statsDialog.close();if(evidenceDialog.open)evidenceDialog.close();toast.hidden=true;clearTimeout(timeout);render();window.scrollTo(0,0);main.focus({preventScroll:true});});
render();
</script>
</body>
</html>
